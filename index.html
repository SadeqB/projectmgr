<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Project Time" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Project Time Manager</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <h1>Project Time Manager</h1>
            <p>Projects, progress, and focused work time.</p>
          </div>
        </div>

        <button id="addProjectButton" class="primary-button" type="button">+ Project</button>
      </aside>

      <main class="workspace">
        <section id="emptyState" class="empty-state">
          <h2>No projects yet</h2>
          <p>Create a project to start planning tasks and to-do items.</p>
        </section>

        <section id="listView" class="editor hidden">
          <section class="panel">
            <div class="panel-header">
              <h2>Projects</h2>
            </div>
            <div id="projectList" class="tree-list"></div>
          </section>
        </section>

        <section id="formView" class="form-view hidden">
          <form id="objectForm" class="form-panel">
            <div class="detail-header">
              <div>
                <span id="formKind" class="eyebrow">Project</span>
                <h2 id="formHeading">New Project</h2>
              </div>
              <div class="button-row">
                <button id="cancelFormButton" class="secondary-button" type="button">Cancel</button>
                <button class="primary-button" type="submit">OK</button>
              </div>
            </div>

            <div class="detail-grid">
              <label class="field-group">
                <span class="field-label">Name</span>
                <input id="formTitle" type="text" required />
              </label>

              <label id="weightGroup" class="field-group">
                <span class="field-label">Share</span>
                <input id="formWeight" type="number" min="0" max="100" />
              </label>

              <label id="doneGroup" class="check-group hidden">
                <input id="formDone" type="checkbox" />
                <span>Done</span>
              </label>

              <label id="currentProgressGroup" class="field-group hidden">
                <span class="field-label">Current Progress</span>
                <input id="formCurrentProgress" type="number" min="0" step="1" />
              </label>

              <label id="maxProgressGroup" class="field-group hidden">
                <span class="field-label">Max Progress</span>
                <input id="formMaxProgress" type="number" min="1" step="1" />
              </label>

              <div id="timerGroup" class="timer-group hidden">
                <div id="timerText" class="timer-text">0:00:00</div>
                <div class="button-row">
                  <button id="startStopTimerButton" class="primary-button" type="button">Start</button>
                  <button id="resetTimerButton" class="secondary-button" type="button">Reset</button>
                </div>
              </div>
            </div>

            <label class="field-group wide">
              <span class="field-label">Description</span>
              <textarea id="formDescription" rows="5"></textarea>
            </label>

            <div class="attachment-grid">
              <section>
                <div class="mini-header">
                  <h3>Photos</h3>
                  <label class="secondary-button file-button">
                    Attach
                    <input id="photoInput" type="file" accept="image/*" multiple />
                  </label>
                </div>
                <div id="photoList" class="photo-grid"></div>
              </section>

              <section>
                <div class="mini-header">
                  <h3>Voice Notes</h3>
                  <button id="recordButton" class="secondary-button" type="button">Record</button>
                </div>
                <div id="voiceList" class="voice-list"></div>
              </section>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
